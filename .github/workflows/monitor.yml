name: monitor

on:
  schedule:
    - cron: "0 23 * * *"      # 매일 08:00 KST (UTC 23:00)
  workflow_dispatch: {}        # 수동 실행 버튼

permissions:
  contents: write              # data/courses.json 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/run.py

      - name: Commit updated data
        run: |
          git config user.name  "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/courses.json
          git commit -m "update data ($(date -u +%F))" || echo "변경 없음"
          git push || echo "push 생략"
